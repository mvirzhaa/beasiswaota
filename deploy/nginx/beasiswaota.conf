# Nginx reverse proxy untuk beasiswaota.uika-bogor.ac.id
#
# Salin ke /etc/nginx/sites-available/beasiswaota.conf lalu symlink ke
# sites-enabled/. Sebelum reload, pastikan sertifikat Certbot sudah ada
# untuk KEDUA domain di bawah (lihat deploy/README.md).
#
# limit_req_zone HARUS di scope http{} — karena file ini di-include lewat
# sites-enabled (yang berada di dalam blok http{} punya nginx.conf), taruh
# di sini (di luar semua blok server{}) sudah benar.
limit_req_zone $binary_remote_addr zone=beasiswaota_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=beasiswaota_api:10m rate=60r/m;

# ============================================================================
# Aplikasi utama
# ============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name beasiswaota.uika-bogor.ac.id;

    # Biarkan Certbot ACME challenge lewat sebelum redirect paksa ke HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name beasiswaota.uika-bogor.ac.id;

    ssl_certificate     /etc/letsencrypt/live/beasiswaota.uika-bogor.ac.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beasiswaota.uika-bogor.ac.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparam.pem;

    # --- Security header ---
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # img-src menyertakan subdomain storage karena bukti berkas/lampiran
    # dimuat browser langsung dari signed URL MinIO di sana.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://storage.beasiswaota.uika-bogor.ac.id; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Batas upload berkas 5MB (validasiBerkas) + sedikit ruang untuk field
    # form lain di request yang sama.
    client_max_body_size 6m;

    # --- Rate limit /login ---
    location = /login {
        limit_req zone=beasiswaota_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params_beasiswaota;
    }

    # --- Rate limit /api/ ---
    location /api/ {
        limit_req zone=beasiswaota_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params_beasiswaota;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params_beasiswaota;
    }
}

# ============================================================================
# Subdomain khusus MinIO (S3 API) — SATU-SATUNYA jalur publik ke bucket
# privat, dipakai signed URL berumur pendek (buatUrlTerlindungi). MinIO
# sendiri TIDAK expose port ke publik (lihat docker-compose.prod.yml),
# jadi ini juga satu-satunya cara signed URL bisa dijangkau browser donatur/
# mahasiswa. Endpoint MinIO (env MINIO_ENDPOINT/PORT/USE_SSL di aplikasi)
# WAJIB diarahkan ke domain ini, bukan ke 127.0.0.1, supaya signature
# presigned URL cocok dengan host yang sesungguhnya diakses browser.
# ============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name storage.beasiswaota.uika-bogor.ac.id;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name storage.beasiswaota.uika-bogor.ac.id;

    ssl_certificate     /etc/letsencrypt/live/storage.beasiswaota.uika-bogor.ac.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/storage.beasiswaota.uika-bogor.ac.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparam.pem;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
