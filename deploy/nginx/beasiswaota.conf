# Nginx reverse proxy untuk beasiswaota.uika-bogor.ac.id
#
# Salin ke /etc/nginx/sites-available/beasiswaota.conf lalu symlink ke
# sites-enabled/. Sebelum reload, pastikan sertifikat sudah ada untuk
# domain di bawah (lihat deploy/README.md).
#
# limit_req_zone HARUS di scope http{} — karena file ini di-include lewat
# sites-enabled (yang berada di dalam blok http{} punya nginx.conf), taruh
# di sini (di luar semua blok server{}) sudah benar.
limit_req_zone $binary_remote_addr zone=beasiswaota_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=beasiswaota_api:10m rate=60r/m;

# ============================================================================
# Aplikasi utama
# ============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name beasiswaota.uika-bogor.ac.id;

    # Biarkan Certbot ACME challenge lewat sebelum redirect paksa ke HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Syntax "listen ... ssl http2" (bukan "http2 on;" terpisah) supaya
    # kompatibel dengan Nginx versi lama (< 1.25.1) yang umum masih
    # terpasang lewat apt di Ubuntu 22.04/24.04.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name beasiswaota.uika-bogor.ac.id;

    ssl_certificate     /etc/letsencrypt/live/beasiswaota.uika-bogor.ac.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beasiswaota.uika-bogor.ac.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparam.pem;

    # --- Security header ---
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Batas upload berkas 5MB (validasiBerkas) + sedikit ruang untuk field
    # form lain di request yang sama.
    client_max_body_size 6m;

    # --- Rate limit /login ---
    location = /login {
        limit_req zone=beasiswaota_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params_beasiswaota;
    }

    # --- Rate limit /api/ ---
    location /api/ {
        limit_req zone=beasiswaota_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params_beasiswaota;
    }

    # --- MinIO (S3 API), diakses lewat PATH bukan subdomain terpisah ---
    # Hanya satu domain yang disediakan (bukan keputusan saya, kondisi
    # dari kampus), jadi bucket privat diproxy lewat path di domain yang
    # sama alih-alih subdomain storage.*. MinIO sendiri tetap TIDAK expose
    # port ke publik (lihat docker-compose.prod.yml, 127.0.0.1 saja) — ini
    # satu-satunya jalur publik ke bucket, dipakai signed URL berumur
    # pendek (buatUrlTerlindungi). Prefix path HARUS sama persis dengan
    # MINIO_BUCKET di .env (default: beasiswaota-berkas) — client MinIO
    # (minio-js) memakai path-style URL untuk endpoint non-AWS, jadi
    # presigned URL berbentuk /<bucket>/<object>?<signature>. Tidak ada
    # location prefix di proxy_pass supaya path lengkap (termasuk nama
    # bucket) diteruskan apa adanya ke MinIO — signature presigned URL
    # mencakup path ini, jadi tidak boleh di-strip/di-rewrite.
    location /beasiswaota-berkas/ {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params_beasiswaota;
    }
}
