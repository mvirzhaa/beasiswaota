services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-beasiswaota}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-beasiswaota}
      POSTGRES_DB: ${POSTGRES_DB:-beasiswaota}
    ports:
      # Host 5433 -> container 5432. Port host 5432 sengaja tidak dipakai
      # karena bentrok dengan Postgres lain yang sudah jalan di beberapa
      # mesin developer.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-beasiswaota}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-beasiswaota}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-beasiswaota123}
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
  minio_data:
